# Local dev stack. Postgres here is dev-only — staging/prod use AWS RDS instead
# (docs/specs/12-database-design.md, docs/specs/13-infra-docker-compose.md).
#
# Usage:
#   cp .env.example .env
#   docker compose up --build
#
# Twenty CRM (Phase 4/5, docs/specs/07-twenty-data-model.md) is opt-in via the
# "twenty" profile — `docker compose --profile twenty up --build` — since it
# isn't needed to work on Medusa/the storefronts and, unlike every other
# service here, its self-hosted config below has NOT been booted or verified
# in this repo's own dev/CI environment (no Docker daemon available there;
# see docs/specs/19-milestones.md). Treat image tags and env var names as a
# best-effort starting point from Twenty's self-hosting docs at the time this
# was written, not a verified-working config — check Twenty's current
# self-hosting guide before relying on it. Once it's up, point this repo's
# backend .env TWENTY_WEBHOOK_URL/TWENTY_API_TOKEN at it (or at a Twenty
# Cloud workspace instead — the integration code only needs a reachable URL
# and shared secrets, it doesn't care which).

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medusa}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-medusa}
      REDIS_URL: redis://redis:6379
      STORE_CORS: http://localhost:8000,http://localhost:8001
      ADMIN_CORS: http://localhost:9000
      AUTH_CORS: http://localhost:9000
      JWT_SECRET: ${JWT_SECRET:-supersecret}
      COOKIE_SECRET: ${COOKIE_SECRET:-supersecret}
    ports:
      - "9000:9000"

  storefront-a:
    build:
      context: .
      dockerfile: apps/storefront-brand-a/Dockerfile
      args:
        MEDUSA_BACKEND_URL: http://backend:9000
        NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${BRAND_A_PUBLISHABLE_KEY:-pk_brand_a}
        NEXT_PUBLIC_BASE_URL: http://localhost:8000
        NEXT_PUBLIC_DEFAULT_REGION: us
    depends_on:
      - backend
    ports:
      - "8000:8000"

  storefront-b:
    build:
      context: .
      dockerfile: apps/storefront-brand-b/Dockerfile
      args:
        MEDUSA_BACKEND_URL: http://backend:9000
        NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${BRAND_B_PUBLISHABLE_KEY:-pk_brand_b}
        NEXT_PUBLIC_BASE_URL: http://localhost:8001
        NEXT_PUBLIC_DEFAULT_REGION: jp
    depends_on:
      - backend
    ports:
      - "8001:8001"

  # Opt-in — see the header comment above. Twenty needs its own Postgres
  # database (not shared with Medusa's — it manages its own schema) and a
  # Redis instance for its background worker; it can share the "redis"
  # service above (a different logical DB index) since Twenty and BullMQ
  # here don't use the same queue names.
  twenty-db:
    image: postgres:16
    profiles: ["twenty"]
    environment:
      POSTGRES_DB: twenty
      POSTGRES_USER: twenty
      POSTGRES_PASSWORD: ${TWENTY_DB_PASSWORD:-twenty}
    volumes:
      - twenty_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twenty"]
      interval: 5s
      timeout: 5s
      retries: 10

  twenty:
    image: twentycrm/twenty:latest
    profiles: ["twenty"]
    depends_on:
      twenty-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PG_DATABASE_URL: postgres://twenty:${TWENTY_DB_PASSWORD:-twenty}@twenty-db:5432/twenty
      REDIS_URL: redis://redis:6379
      SERVER_URL: ${TWENTY_SERVER_URL:-http://localhost:3000}
      # docker compose interpolates every service's env block up front
      # regardless of which profile is active, so a required (`:?`) var
      # here would break `docker compose up` for everyone, not just people
      # using the twenty profile — a placeholder default it is. Twenty
      # will boot but must not be used past local experimentation with this
      # value; set a real TWENTY_APP_SECRET before anything resembling
      # production.
      APP_SECRET: ${TWENTY_APP_SECRET:-changeme-generate-a-real-secret}
    ports:
      - "3000:3000"

volumes:
  pgdata:
  twenty_pgdata:
